openapi: 3.0.3
info:
  title: ODC Track Backend API
  description: Documentation OpenAPI (spec-first) de l'API ODC Track.
  version: 1.0.0

servers:
  - url: http://localhost:3001/api/v1
    description: Local
  - url: https://odc-track-backend.onrender.com/api/v1
    description: Production

tags:
  - name: Auth
  - name: Users
  - name: Referentiels
  - name: Promotions
  - name: Apprenants
  - name: Situations
  - name: Documents
  - name: Statistiques

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@odc.com
        password:
          type: string
          example: Admin@1234

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOi...

    ChangePasswordRequest:
      type: object
      required: [ancienPassword, newPassword]
      properties:
        ancienPassword:
          type: string
          example: Admin@1234
        newPassword:
          type: string
          example: Admin@12345

    CreateUserRequest:
      type: object
      required: [nom, prenom, email, role]
      properties:
        nom:
          type: string
          example: Sembene
        prenom:
          type: string
          example: Pape
        email:
          type: string
          format: email
          example: pape.sembene@odc.com
        role:
          type: string
          enum: [ADMIN, COACH, POLE_EMPLOI, APPRENANT, MANAGER]
          example: MANAGER

    CreateReferentielRequest:
      type: object
      required: [nom]
      properties:
        nom:
          type: string
          example: AWS
        description:
          type: string
          nullable: true
          example: Cloud AWS

    CreatePromotionRequest:
      type: object
      required: [nom, annee, referentielIds]
      properties:
        nom:
          type: string
          example: Promotion AWS 2026
        annee:
          type: integer
          example: 2026
        referentielIds:
          type: array
          items:
            type: string
            format: uuid
          example:
            - 11111111-1111-1111-1111-111111111111

    CreateSituationRequest:
      type: object
      required: [statut, dateDebut]
      properties:
        statut:
          type: string
          enum: [RECHERCHE_EMPLOI, EN_STAGE, EN_EMPLOI, PROJET_PERSO, POURSUITE_ETUDES]
          example: EN_STAGE
        dateDebut:
          type: string
          format: date
          example: 2026-01-10
        dateFin:
          type: string
          format: date
          nullable: true
          example: 2026-04-30
        commentaire:
          type: string
          nullable: true
          example: Stage de 3 mois
        entrepriseId:
          type: string
          format: uuid
          nullable: true
          example: 22222222-2222-2222-2222-222222222222

    ValidateSituationRequest:
      type: object
      properties:
        commentaire:
          type: string
          example: Dossier validé

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Connexion utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion réussie

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Renouveler le token d'accès
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token renouvelé

  /auth/logout:
    post:
      tags: [Auth]
      summary: Déconnexion
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Déconnexion réussie

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Changer le mot de passe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Mot de passe changé

  /users:
    get:
      tags: [Users]
      summary: Lister les utilisateurs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Users]
      summary: Créer un utilisateur
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Créé

  /users/{id}:
    get:
      tags: [Users]
      summary: Détail utilisateur
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK

  /referentiels:
    get:
      tags: [Referentiels]
      summary: Lister les référentiels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Referentiels]
      summary: Créer un référentiel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReferentielRequest'
      responses:
        '201':
          description: Créé

  /promotions:
    get:
      tags: [Promotions]
      summary: Lister les promotions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      tags: [Promotions]
      summary: Créer une promotion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromotionRequest'
      responses:
        '201':
          description: Créé

  /apprenants:
    get:
      tags: [Apprenants]
      summary: Lister les apprenants
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK

  /apprenants/{id}:
    get:
      tags: [Apprenants]
      summary: Détail apprenant
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK

  /apprenants/me/situations:
    post:
      tags: [Situations]
      summary: Déclarer ma situation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSituationRequest'
      responses:
        '201':
          description: Créé

  /situations/{id}/validation:
    patch:
      tags: [Situations]
      summary: Valider une situation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateSituationRequest'
      responses:
        '200':
          description: OK

  /apprenants/me/documents:
    post:
      tags: [Documents]
      summary: Upload document (apprenant)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type:
                  type: string
                  enum: [CONTRAT, ATTESTATION, LETTRE_MISSION, CV, AUTRE]
                  example: CV
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Créé

  /apprenants/{apprenantId}/documents:
    get:
      tags: [Documents]
      summary: Lister les documents d'un apprenant
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: apprenantId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK

  /statistiques/globales:
    get:
      tags: [Statistiques]
      summary: Statistiques globales
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK

  /statistiques/promotions/{promotionId}:
    get:
      tags: [Statistiques]
      summary: Statistiques par promotion
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: promotionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK

  /statistiques/referentiels/{referentielId}:
    get:
      tags: [Statistiques]
      summary: Statistiques par référentiel
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: referentielId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK

  /statistiques/periode:
    get:
      tags: [Statistiques]
      summary: Statistiques par période
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
            format: date
          example: 2026-01-01
        - in: query
          name: dateTo
          schema:
            type: string
            format: date
          example: 2026-12-31
      responses:
        '200':
          description: OK
