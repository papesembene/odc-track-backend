apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odc-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/papesembene/odc-track-backend
    targetRevision: feature/gitops-argocd
    path: infra/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: odc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
