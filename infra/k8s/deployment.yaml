apiVersion: apps/v1
kind: Deployment
metadata:
  name: odc-api
  namespace: odc
  labels:
    app: odc-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: odc-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: odc-api
    spec:
      containers:
        - name: odc-api
          image: papesembene/odc-track-backend:gitops-v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: odc-api-secrets
                  key: DATABASE_URL
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: odc-api-secrets
                  key: DIRECT_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: odc-api-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: odc-api-secrets
                  key: JWT_EXPIRES_IN
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: odc-api-secrets
                  key: JWT_REFRESH_SECRET
            - name: JWT_REFRESH_EXPIRES_IN
              valueFrom:
                secretKeyRef:
                  name: odc-api-secrets
                  key: JWT_REFRESH_EXPIRES_IN
          readinessProbe:
            httpGet:
              path: /api/v1
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 15
